<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>仓库存储调试工具</title>
    <style>
        body {
            font-family: 'Consolas', monospace;
            padding: 20px;
            background: #0a0e14;
            color: #c5d4dd;
        }
        h1 { color: #00d4ff; }
        h2 { color: #00f084; margin-top: 30px; }
        pre {
            background: #1a1f29;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #2d3748;
            overflow-x: auto;
        }
        button {
            background: #00d4ff;
            color: #0a0e14;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-family: inherit;
        }
        button:hover { background: #00f084; }
        button.danger { background: #ff6b6b; color: white; }
        .repo-item {
            background: #1a1f29;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #00d4ff;
        }
        .duplicate { border-left-color: #ff6b6b; }
    </style>
</head>
<body>
    <h1>仓库存储调试工具</h1>

    <div>
        <button onclick="loadData()">刷新数据</button>
        <button onclick="removeDuplicates()">去除重复</button>
        <button class="danger" onclick="clearAll()">清空所有</button>
    </div>

    <h2>当前存储的仓库</h2>
    <div id="repos"></div>

    <h2>原始 JSON 数据</h2>
    <pre id="raw"></pre>

    <script>
        function loadData() {
            const data = localStorage.getItem('repo-store-v2');
            const rawEl = document.getElementById('raw');
            const reposEl = document.getElementById('repos');

            if (!data) {
                rawEl.textContent = '(无数据)';
                reposEl.innerHTML = '<p>localStorage 中没有仓库数据</p>';
                return;
            }

            try {
                const parsed = JSON.parse(data);
                rawEl.textContent = JSON.stringify(parsed, null, 2);

                const repos = parsed.state?.repos || [];

                // 检测重复
                const seen = new Map();
                const duplicates = new Set();

                repos.forEach(repo => {
                    const key = `${repo.repoPath || repo.graphId}`;
                    if (seen.has(key)) {
                        duplicates.add(repo.repoId);
                        duplicates.add(seen.get(key));
                    } else {
                        seen.set(key, repo.repoId);
                    }
                });

                reposEl.innerHTML = repos.map((repo, i) => {
                    const isDup = duplicates.has(repo.repoId);
                    return `
                        <div class="repo-item ${isDup ? 'duplicate' : ''}">
                            <strong>${i + 1}. ${repo.repoName}</strong> ${isDup ? '⚠️ 重复' : ''}
                            <br>repoId: ${repo.repoId}
                            <br>graphId: ${repo.graphId || '(未生成)'}
                            <br>repoPath: ${repo.repoPath || '(无)'}
                            <br>status: ${repo.status || 'saved'}
                            <br>createdAt: ${repo.createdAt}
                        </div>
                    `;
                }).join('');

                if (duplicates.size > 0) {
                    reposEl.innerHTML = `<p style="color: #ff6b6b;">⚠️ 检测到 ${duplicates.size} 个重复仓库</p>` + reposEl.innerHTML;
                }

            } catch (e) {
                rawEl.textContent = '解析错误: ' + e.message;
            }
        }

        function removeDuplicates() {
            const data = localStorage.getItem('repo-store-v2');
            if (!data) return;

            try {
                const parsed = JSON.parse(data);
                const repos = parsed.state?.repos || [];

                // 按 repoPath 或 graphId 去重，保留最新的
                const uniqueMap = new Map();
                repos.forEach(repo => {
                    const key = repo.repoPath || repo.graphId || repo.repoId;
                    const existing = uniqueMap.get(key);
                    if (!existing || new Date(repo.createdAt) > new Date(existing.createdAt)) {
                        uniqueMap.set(key, repo);
                    }
                });

                parsed.state.repos = Array.from(uniqueMap.values());
                localStorage.setItem('repo-store-v2', JSON.stringify(parsed));

                alert(`去重完成！从 ${repos.length} 个减少到 ${uniqueMap.size} 个`);
                loadData();
            } catch (e) {
                alert('去重失败: ' + e.message);
            }
        }

        function clearAll() {
            if (confirm('确定要清空所有仓库数据吗？此操作不可恢复！')) {
                localStorage.removeItem('repo-store-v2');
                alert('已清空');
                loadData();
            }
        }

        // 自动加载
        loadData();
    </script>
</body>
</html>
